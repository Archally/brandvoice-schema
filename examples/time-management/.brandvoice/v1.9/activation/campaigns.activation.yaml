version: "1.0.0"
programs:
  - id: PRG001
    name: "Time Intelligence Research"
    status: active
    objective: >-
      Ongoing research publication program that positions Chronoflow as
      the authority on engineering time allocation. Publishes quarterly
      reports using anonymized customer data - establishing thought
      leadership and creating SEO-optimized content that drives inbound.
    message_house_refs: [MHS001]
    campaign_refs: [CMP001]

  - id: PRG002
    name: "Deep Work Advocacy"
    status: active
    objective: >-
      Conference speaking and community engagement program that builds
      trust through education rather than promotion. Positions the
      Chronoflow team as practitioners sharing hard-won insights.
    message_house_refs: [MHS001]

content_pillars:
  - id: CPL001
    name: "Meeting culture data"
    angle: >-
      Original research findings on how engineering teams spend time in
      meetings - frequency trends, fragmentation patterns, and what
      high-performing teams do differently. Data-heavy, opinion-light.
    message_refs: [MSG002, MSG005]
    program_refs: [PRG001]

  - id: CPL002
    name: "Deep work methodology"
    angle: >-
      Practical frameworks for protecting deep work in engineering teams.
      Not just theory (Cal Newport) but operational guidance - async
      meeting formats, no-meeting-day implementations, and measured results.
    message_refs: [MSG001, MSG003]
    program_refs: [PRG002]

  - id: CPL003
    name: "Privacy-first engineering"
    angle: >-
      How to measure team effectiveness without surveillance - technical
      architecture decisions, cultural implications, and why privacy is
      a product feature, not a compliance checkbox.
    message_refs: [MSG001, MSG003]
    program_refs: [PRG001]

campaigns:
  - id: CMP001
    name: "State of Engineering Time 2026"
    status: draft
    objective: >-
      Annual research report that becomes the definitive source on
      engineering time allocation patterns. Gated download drives leads;
      ungated executive summary drives awareness.
    start_date: "2026-09-01"
    end_date: "2026-10-31"
    message_refs: [MSG002, MSG005]
    channel_refs: [CHN001, CHN002, CHN003]
    outcome_refs: [OUT001, OUT002]
    opportunity_refs: [OPP001]

  - id: CMP002
    name: "Meeting-Free Month Challenge"
    status: draft
    objective: >-
      Challenge engineering teams to reduce meeting load by 20% for one
      month using Chronoflow to measure before/after. Creates user-generated
      content and social proof while demonstrating product value.
    start_date: "2026-06-01"
    end_date: "2026-06-30"
    message_refs: [MSG001, MSG002]
    channel_refs: [CHN001, CHN004]
    outcome_refs: [OUT001]
