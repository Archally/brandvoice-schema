version: "1.0.0"
competitors:
  - id: CPR001
    name: "Clockwise"
    type: direct
    description: >-
      AI calendar optimization tool that automatically reschedules meetings
      to create Focus Time blocks. Strong in calendar management but limited
      in analytics — shows what happened but not why or what to change.
      Acquired by Atlassian in 2024, creating integration advantages but
      also dependency on the Atlassian ecosystem.
    threat_level: high
    pricing:
      model: per-seat
      currency: USD
      tiers:
        - name: "Free"
          price: "$0"
          price_numeric: 0
          billing_period: monthly
        - name: "Teams"
          price: "$6.75/user/month"
          price_numeric: 6.75
          billing_period: monthly
        - name: "Enterprise"
          price: "Custom"
          billing_period: annual
    strengths:
      - "AI-powered Focus Time scheduling — automatic block creation"
      - "Atlassian ecosystem integration (Jira, Confluence)"
      - "Low friction — works with existing Google Calendar"
    weaknesses:
      - "Calendar optimization only — no workflow analytics or insights"
      - "Atlassian acquisition creates vendor lock-in concerns"
      - "No team-level pattern analysis or bottleneck detection"
    evidence_refs: [EVD008]

  - id: CPR002
    name: "Jellyfish"
    type: direct
    description: >-
      Engineering management platform providing metrics on delivery,
      investment allocation, and team health. Targets VP Eng and CTO
      with executive dashboards. Positioned as engineering intelligence
      rather than time management, but overlaps significantly in the
      measurement space.
    threat_level: high
    pricing:
      model: per-seat
      currency: USD
      tiers:
        - name: "Starter"
          price: "$15/user/month"
          price_numeric: 15
          billing_period: monthly
        - name: "Enterprise"
          price: "Custom"
          billing_period: annual
    strengths:
      - "Strong executive-level reporting and board-ready dashboards"
      - "Investment allocation tracking across initiatives"
      - "Integrations with Jira, GitHub, and CI/CD systems"
    weaknesses:
      - "Top-down view — engineers see it as surveillance, not enablement"
      - "Expensive for mid-size teams ($15+/user/month)"
      - "Focused on output metrics, not time quality or deep work"
    evidence_refs: [EVD008, EVD006]

  - id: CPR003
    name: "Toggl Track"
    type: direct
    description: >-
      Established time tracking tool with a broad user base across
      freelancers, agencies, and enterprise. Strong in manual time entry
      and reporting but fundamentally passive — requires user action to
      log time, producing compliance burden rather than insight.
    threat_level: medium
    pricing:
      model: per-seat
      currency: USD
      tiers:
        - name: "Free"
          price: "$0"
          price_numeric: 0
          billing_period: monthly
        - name: "Starter"
          price: "$10/user/month"
          price_numeric: 10
          billing_period: monthly
        - name: "Premium"
          price: "$20/user/month"
          price_numeric: 20
          billing_period: monthly
    strengths:
      - "Simple, intuitive interface with broad adoption"
      - "Extensive reporting and billable hours features"
      - "Multi-platform with desktop, web, and mobile apps"
    weaknesses:
      - "Manual time entry creates compliance fatigue"
      - "No AI-driven insights or pattern detection"
      - "Designed for billing use case, not team effectiveness"
    evidence_refs: [EVD008]

  - id: CPR004
    name: "RescueTime"
    type: direct
    description: >-
      Automatic time tracking tool that categorizes desktop and app usage.
      Provides individual productivity reports. Good for personal awareness
      but limited team features and no actionable workflow recommendations.
    threat_level: low
    pricing:
      model: per-seat
      currency: USD
      tiers:
        - name: "Lite"
          price: "$0"
          price_numeric: 0
          billing_period: monthly
        - name: "Premium"
          price: "$12/month"
          price_numeric: 12
          billing_period: monthly
    strengths:
      - "Fully automatic — no manual time entry"
      - "Detailed app and website categorization"
      - "Focus session mode with distraction blocking"
    weaknesses:
      - "Individual-focused — no team analytics"
      - "Privacy concerns with screen monitoring approach"
      - "Descriptive only — shows what happened but no actionable insights"
    evidence_refs: [EVD008]

  - id: CPR005
    name: "Spreadsheets and manual tracking"
    type: substitute
    description: >-
      Many engineering leaders still use manual surveys, spreadsheets, and
      gut feeling to assess team time allocation. Zero software cost but
      high labor cost and poor accuracy. The status quo competitor that
      Chronoflow must displace by demonstrating ROI over self-serve methods.
    threat_level: medium
    pricing:
      model: free
    strengths:
      - "Zero cost and zero procurement friction"
      - "Fully customizable to team context"
      - "No privacy concerns — data stays internal"
    weaknesses:
      - "Manual data collection is inaccurate and biased"
      - "Time-consuming to maintain — ironic for a time management solution"
      - "No pattern detection, prediction, or automated insights"
    evidence_refs: [EVD005]
