version: "1.0.0"
market_refs: [MKT001]

actors:
  - id: ACT001
    name: "Busy professional"
    role: buyer
    description: >-
      Working professional aged 28-42 with a demanding job, 45-60 hour
      work weeks, and irregular schedule. Has fitness intentions and prior
      gym experience but struggles with consistency due to travel, late
      meetings, and energy fluctuations. Has tried 2-3 fitness apps before
      and churned within 6 weeks each time.
    priority: high
    evidence_refs: [EVD002]

  - id: ACT002
    name: "Home workout enthusiast"
    role: user
    description: >-
      Person who prefers exercising at home or in hotel rooms with minimal
      equipment (dumbbells, resistance bands, bodyweight). May have young
      children, live far from a gym, or simply prefer the convenience
      and time savings of home training.
    priority: medium
    evidence_refs: [EVD002]

contexts:
  - id: CTX001
    name: "Post-pandemic home fitness shift"
    trigger: >-
      COVID-19 permanently shifted a significant segment of exercisers
      toward home and hybrid training. Many professionals discovered
      that eliminating gym commute time made fitness more sustainable.
      This context favors apps with strong bodyweight and minimal-equipment
      programming.
    evidence_refs: [EVD003]

needs:
  - id: NED001
    statement: >-
      I need a workout plan that adapts when my day changes - a 45-minute
      session that becomes 20 minutes when a meeting runs over, or switches
      to bodyweight when I am traveling without gym access. Current apps
      either give me the original plan or nothing.
    actors: [ACT001, ACT002]
    need_type: functional
    urgency: critical
    evidence_refs: [EVD002]

  - id: NED002
    statement: >-
      I want the app to learn from my feedback and biometrics - not just
      my stated goals. If I slept poorly, suggest a lighter session. If I
      have been consistent for three weeks, progress the difficulty. Make
      it feel like a coach who knows me.
    actors: [ACT001]
    need_type: functional
    urgency: high
    evidence_refs: [EVD001]

  - id: NED003
    statement: >-
      I need to see that my efforts are working - not just calories burned
      but strength gained, consistency streaks, and how my capacity has
      grown over time. Show me the trajectory, not just today's numbers.
    actors: [ACT001, ACT002]
    need_type: emotional
    urgency: medium
    evidence_refs: [EVD002]

offerings:
  - id: OFF001
    name: "FitPulse Pro"
    value_statement: >-
      Reduces decision fatigue to zero - open the app and your workout is
      ready, adapted to today's reality. Eliminates the #1 reason people
      quit fitness apps: plan rigidity.
    capabilities:
      - "Full AI-adaptive programming"
      - "Wearable integration (Apple Watch, Garmin, Whoop)"
      - "Schedule-aware workout generation"
      - "Progress analytics and strength tracking"
    target_audiences: [AUD001]
    competitors: [CPR001, CPR002]
    solves_needs: [NED001, NED002, NED003]
    evidence_refs: [EVD001]

  - id: OFF002
    name: "FitPulse Free"
    value_statement: >-
      Lets users experience adaptive programming with enough value to build
      the habit but enough limitation to drive upgrade intent.
    capabilities:
      - "3 adaptive workouts per week"
      - "Basic progress tracking"
      - "Limited exercise library"
    solves_needs: [NED001]

positioning:
  - id: POS001
    market_category: "AI fitness coaching"
    differentiated_claim: >-
      For busy professionals who have tried and abandoned fitness apps,
      FitPulse is the AI coaching app that adapts every workout to your
      actual day - your schedule, energy, and equipment - so you never
      have to choose between your plan and your life.
    category_strategy:
      frame_of_reference: "AI fitness coaching"
      category_definition: "Schedule-aware adaptive fitness programming"
      category_move: create
    competitors: [CPR001, CPR002]
    evidence_refs: [EVD001, EVD002]

audiences:
  - id: AUD001
    name: "Busy professionals seeking consistent training"
    need: "Keep a sustainable workout routine when schedules change."
    evidence_level: hypothesis
