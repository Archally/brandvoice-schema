name: Validate and Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:examples
      - run: npm run check:examples
      - run: npm test
      - run: npm run doc-snippets
      - run: npm run docs:check
      - run: npm run atlas:check
      - run: npm run release:check
      - run: node tools/port/verify-ported.mjs
      - run: node --test tools/port/*.test.mjs
