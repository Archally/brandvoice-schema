---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Governance - Decisions
description: >
  Decision log for strategic and communication choices. Stores rationale,
  alternatives, impacts, and links to measured outcomes.
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    description: Record the version declared for this Brandvoice model file.
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    description: Identify the Brandvoice schema revision used to author this file.
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    description: Set the context prefix that identifies the namespace for this file.
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    description: Add short labels that help contributors group and find related records.
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  risks:
    description: List uncertainties that may affect brand strategy or its execution.
    type: array
    items:
      $ref: "#/$defs/risk"
  decisions:
    description: >-
      Preserve strategic choices and the rationale needed to revisit them later.
    type: array
    items:
      $ref: "#/$defs/decision"

$defs:
  risk:
    description: Record an uncertain event, its consequences, and the intended response.
    type: object
    additionalProperties: false
    required: [id, title, likelihood, impact]
    properties:
      id:
        description: >-
          Assign a stable reference so other model records can link to this entry.
        $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
      title:
        description: Name the uncertain event in terms a reviewer can recognize.
        examples:
          - "Volunteers overlook an invitation sent during their usual work hours."
        type: string
      likelihood:
        description: >-
          Estimate the chance of occurrence within the relevant operating context.
        examples:
          - "medium"
        type: string
        enum: [low, medium, high]
      impact:
        description: Rate the likely consequence if the risk materializes.
        examples:
          - "high"
        type: string
        enum: [low, medium, high, critical]
      mitigation:
        description: >-
          Describe a step that reduces likelihood, exposure, or the cost of occurrence.
        examples:
          - "Test an evening reminder with volunteers who opt in."
        type: string
      status:
        description: Record how the risk is currently being managed.
        type: string
        enum: [identified, mitigating, accepted, resolved]
      affects:
        description: Link the strategies or execution elements exposed to this risk.
        $ref: "../metamodel.schema.yaml#/$defs/impact_links"
      evidence_refs:
        description: >-
          Link source records that support the claims or choices captured here.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      geo_scope:
        $ref: "../metamodel.schema.yaml#/$defs/geo_scope"
        description: >
          Optional geographic applicability of this risk. Use when the
          risk applies only to a specific region (e.g. a naming collision
          that only exists in one language market). See metamodel.geo_scope.
          Added in v1.4.0.
      tags:
        description: >-
          Add short labels that help contributors group and find related records.
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  decision:
    description: >-
      Preserve the choice, alternatives, and evidence that explain a strategic
      commitment.
    type: object
    additionalProperties: false
    required: [id, title, status, date, rationale]
    properties:
      id:
        description: >-
          Assign a stable reference so other model records can link to this entry.
        $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      title:
        description: >-
          Use an action-oriented label that makes the choice easy to retrieve.
        type: string
      status:
        description: Record the current review or delivery state of this choice.
        examples:
          - "accepted"
        type: string
        enum: [proposed, accepted, rejected, superseded, landed]
      date:
        description: Record the date associated with this decision log entry.
        examples:
          - "2026-03-18"
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      rationale:
        description: >-
          Capture the problem, options, and reasoning needed to understand the choice.
        examples:
          - problem: Volunteers miss open shifts in long chat threads.
            alternatives:
              - Use a shared roster
              - Keep chat and pin a weekly message
            selected: Use a shared roster
            why: The roster shows gaps without requiring a chat search.
        type: object
        additionalProperties: false
        required: [problem, selected]
        properties:
          problem:
            description: >-
              State the condition that prompted a decision and whose work it affects.
            type: string
          alternatives:
            description: >-
              List the viable courses of action considered before selecting one.
            type: array
            items:
              type: string
          selected:
            description: >-
              State the option chosen in enough detail to recognize its implementation.
            type: string
          why:
            description: >-
              Explain the evidence and trade-offs that favored the selected option.
            type: string
      impacts:
        description: >-
          Link the strategy or execution elements this choice directly changes.
        $ref: "../metamodel.schema.yaml#/$defs/impact_links"
      risks:
        description: Link risks that may arise from or affect this decision.
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
      evidence_refs:
        description: >-
          Link source records that support the claims or choices captured here.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      supersedes:
        description: >-
          Link earlier decisions replaced by this choice so history remains traceable.
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      blueprint_links:
        description: >-
          Link Blueprint elements that implement or explain this Brandvoice record.
        $ref: "../metamodel.schema.yaml#/$defs/optional_blueprint_links"
      tags:
        description: >-
          Add short labels that help contributors group and find related records.
        $ref: "../metamodel.schema.yaml#/$defs/tags"
