---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Governance - Evidence
description: >
  Traceable evidence records backing strategy and execution claims across
  entities, decisions, and experiments.
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    description: Record the version declared for this Brandvoice model file.
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    description: Identify the Brandvoice schema revision used to author this file.
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    description: Set the context prefix that identifies the namespace for this file.
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    description: Add short labels that help contributors group and find related records.
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  evidence:
    description: Collect traceable observations and sources so claims can be reviewed.
    type: array
    items:
      $ref: "#/$defs/evidence_record"

$defs:
  evidence_record:
    description: >-
      Capture what a source shows, how it was obtained, and which claims it bears on.
    type: object
    additionalProperties: false
    required: [id, title, type, date]
    properties:
      id:
        description: >-
          Assign a stable reference so other model records can link to this entry.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_ref"
      title:
        description: >-
          Name the observation or source so reviewers can identify it in citations.
        type: string
      type:
        examples:
          - "interview"
        type: string
        enum:
          - assumption
          - interview
          - survey
          - analytics
          - experiment
          - observation
          - secondary-research
          - expert-opinion
          - benchmark
          - internal-analysis
          - market-data
          - market-signal
          - competitor-intelligence
          - primary-data
          - research
          - primary-research
          - primary-academic
          - thought-leadership
          - analyst-report
        description: >
          Evidence source class. Rationale: distinguish externally observed
          signals from internally synthesized analysis for confidence weighting.
          Extended in v1.6.1: market-data, market-signal, competitor-intelligence,
          primary-data added for multi-brand portfolio evidence migration.
          Extended in v1.6.2: research, primary-research, primary-academic,
          thought-leadership, analyst-report - additional evidence-source
          credibility classes for portfolio and academic sourcing. Permissive
          author taxonomy; a future curation pass may consolidate the
          research/* family.
      date:
        description: Record when the finding was observed or the source was published.
        examples:
          - "2026-02-12"
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      source:
        examples:
          - "Volunteer coordinator interviews from the winter repair scheduling pilot"
        type: string
        description: "Human-readable source label for the evidence artifact or origin."
      source_type:
        examples:
          - "first-party"
        type: string
        enum:
          - first-party
          - third-party
          - internal
          - external
          - mixed
          - industry-report
          - thought-leadership
          - technology-report
          - analyst-report
          - market-data
          - competitor-website
          - own-website
          - self-assessment
          - third-party-validation
          - peer-reviewed
          - academic-classic
          - practitioner-credible
          - industry-analysis
          - industry-consortium
          - secondary-research
          - survey
          - internal-analysis
          - primary-data
        description: >
          Origin or format of the evidence source. Party-based values (first-party,
          third-party, internal, external, mixed) classify who produced it.
          Format-based values (industry-report, competitor-website, etc.) classify
          what kind of publication it is. Extended in v1.6.1 with format-based values.
          Extended in v1.6.2: peer-reviewed, academic-classic, practitioner-credible,
          industry-analysis, industry-consortium - additional source-credibility
          classes. Also secondary-research, survey, internal-analysis, primary-data -
          research-method values authors use to classify a source; permissive by
          intent, a future curation pass may split method (type) from origin
          (source_type).
      source_url:
        examples:
          - "https://example.org/research/repair-scheduling"
        type: string
        pattern: "^[a-z]+://.+$"
        description: "Canonical URL for the source when one exists."
      publisher:
        type: string
        description: "Organization, platform, or person that published the source."
      method:
        description: >-
          Describe how observations were collected or how the source produced its
          findings.
        examples:
          - "Semi-structured interviews about the most recent volunteer cancellation."
        type: string
      sample_size:
        description: >-
          Record the number of people or observations underlying the finding when
          known.
        examples:
          - 8
        type: integer
      summary:
        description: >-
          State the relevant finding and any qualification reviewers need to interpret
          it.
        examples:
          - "Six of eight coordinators recalled discovering an open shift after the final reminder."
        type: string
      confidence:
        description: State the evidence level warranted by the source and method.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_level"
      supports:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/any_entity_ref"
        description: "Entity references this evidence supports."
      contradicts:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/any_entity_ref"
        description: "Entity references this evidence challenges."
      superseded_by:
        type: array
        minItems: 1
        items:
          $ref: "../metamodel.schema.yaml#/$defs/evidence_ref"
        description: >
          Evidence records whose claims replace this record's claims. A record named
          here is newer evidence on the same subject; list several when the replacement
          is split across records. A record replaced only in part keeps its `supports`
          and states in its `summary` which part is replaced. Evidence-freshness checks
          classify a record with this field as superseded rather than expired or fresh.
          Omit the field while the record is current; an empty list is not allowed.
        examples:
          - ["EVD042"]
          - ["market.EVD042", "market.EVD051"]
      related_experiments:
        description: Link experiments that produced or used this evidence record.
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/test_ref"
      related_decisions:
        description: Link decisions whose rationale draws on this evidence.
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      geo_scope:
        $ref: "../metamodel.schema.yaml#/$defs/geo_scope"
        description: >
          Optional geographic applicability of this evidence record. See
          metamodel.geo_scope. Added in v1.4.0 - when omitted, viewers
          treat the record as geographically untagged.
      tags:
        description: >-
          Add short labels that help contributors group and find related records.
        $ref: "../metamodel.schema.yaml#/$defs/tags"
