---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Migration Schema
description: >
  Ordered model changes for brandvoice evolution. Supports both ontology-level
  structure changes and communication-level campaign/message evolution.
type: object
additionalProperties: false
required: [migration, changes]
properties:
  schemaVersion:
    description: "Declare which Brandvoice schema release this file targets."
    examples:
      - "1.9.3"
    $ref: "metamodel.schema.yaml#/$defs/schema_version"
  migration:
    description: "Identify the change record and explain why the model is evolving."
    type: object
    additionalProperties: false
    required: [id, name, date, status, change_scope]
    properties:
      id:
        description: "Keep this identifier stable so later records can cite the change."
        examples:
          - "MIG014"
        $ref: "metamodel.schema.yaml#/$defs/migration_ref"
      name:
        description: "Use a short slug that makes this change recognizable in file listings."
        examples:
          - "consolidate-onboarding-messages"
        type: string
        pattern: "^[a-z0-9-]+$"
      date:
        description: "Record the date associated with the migration record."
        examples:
          - "2026-04-15"
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      status:
        description: "Distinguish work under discussion, work queued for application, and changes already applied or rolled back."
        examples:
          - "pending"
        type: string
        enum: [draft, pending, applied, rolled-back]
      change_scope:
        examples:
          - "communication"
        type: string
        enum: [ontology, communication, mixed]
        description: "ontology=structure/model semantics, communication=campaign/message updates."
      intent:
        examples:
          - "consolidate"
        type: string
        enum:
          - discover
          - refine
          - reclassify
          - invalidate
          - pivot
          - expand
          - consolidate
          - measure
        description: >
          Semantic intent behind this migration. Captures WHY the change
          was made at a strategic level, complementing the mechanical
          change kinds (add/modify/deprecate) that describe WHAT changed.
      description:
        description: "Summarize the change and the effect readers should expect in the model."
        type: string
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "metamodel.schema.yaml#/$defs/evidence_refs"
      related_decisions:
        description: "Link the recorded decisions that explain or authorize the change."
        type: array
        items:
          $ref: "metamodel.schema.yaml#/$defs/decision_ref"
      tags:
        description: "Add reusable labels that help readers find related records."
        $ref: "metamodel.schema.yaml#/$defs/tags"

  changes:
    description: "Group the proposed edits by the part of the model each edit affects."
    type: object
    additionalProperties: false
    properties:
      entities:
        description: "Use these entries to record changes to an entity as a whole."
        type: array
        items:
          $ref: "#/$defs/entity_change"
      properties:
        description: "Use these entries for edits to named fields on existing entities."
        type: array
        items:
          $ref: "#/$defs/property_change"
      relationships:
        description: "Use these entries for links added, removed, redirected, or otherwise changed between entities."
        type: array
        items:
          $ref: "#/$defs/relationship_change"
      content_timeline:
        type: array
        description: "Communication-level content and campaign lifecycle changes."
        items:
          $ref: "#/$defs/content_change"

$defs:
  entity_change:
    description: "Record a whole entity change with enough context to review its effect."
    type: object
    additionalProperties: false
    required: [kind, entity_type, target]
    properties:
      kind:
        description: "Choose how the record changes across the model revisions."
        examples:
          - "deprecate"
        type: string
        enum: [add, modify, deprecate, remove, split, merge]
      entity_type:
        description: "Name the entity kind so reviewers can locate the owning layer."
        type: string
        enum:
          - actor
          - action
          - asset
          - audience
          - brand
          - brand-script
          - business-model
          - campaign
          - channel
          - competitor
          - content
          - context
          - decision
          - evidence
          - experiment
          - job
          - journey-stage
          - kpi
          - market
          - market-force
          - message
          - metric
          - need
          - offering
          - opportunity
          - outcome
          - persona
          - position-map
          - positioning
          - proof
          - risk
          - tone
          - value
          - verbal-guideline
          - personal-brand-profile
          - message-house
          - message-pillar
          - program
          - content-pillar
          - white-space
      target:
        description: "Identify the affected entity with its stable model identifier."
        examples:
          - "MSG014"
        type: string
      before:
        description: "Capture the earlier entity values relevant to reviewing this change."
        type: object
      after:
        description: "Capture the entity values expected after the change is applied."
        type: object
      reason:
        description: "Explain why the entity needs this change and what prompted it."
        type: string

  property_change:
    description: "Record an edit to a named field without restating the whole entity."
    type: object
    additionalProperties: false
    required: [kind, target, property]
    properties:
      kind:
        description: "Distinguish replacement, removal, renaming, and collection membership edits."
        type: string
        enum: [set, unset, rename, append, remove-item]
      target:
        description: "Identify the entity whose field is being changed."
        type: string
      property:
        description: "Name the field on the target record that the edit applies to."
        type: string
      value:
        description: "Supply the replacement value or the item involved in a collection edit."
      old_value:
        description: "Capture the previous value when reviewers need it to compare versions."
      new_name:
        description: "Supply the replacement field name for a rename operation."
        type: string
      reason:
        description: "Explain why this field needs to change for this entity."
        type: string

  relationship_change:
    description: "Record a change to a directed relationship between model entities."
    type: object
    additionalProperties: false
    required: [kind, subject, predicate, object]
    properties:
      kind:
        description: "Choose the operation that describes what happens to the link."
        type: string
        enum: [add, remove, redirect, modify]
      subject:
        description: "Identify the source entity from which the relationship is recorded."
        type: string
      predicate:
        description: "Name the relationship so the same pair can have distinct links."
        type: string
      object:
        description: "Identify the relationship target, using the previous target when redirecting a link."
        type: string
      new_object:
        description: "Provide the replacement target entity when the relationship is redirected."
        type: string
      reason:
        description: "Explain why the link changes and what modeling decision it represents."
        type: string

  content_change:
    description: "Record when a change to a message, campaign, or content asset takes effect."
    type: object
    additionalProperties: false
    required: [target, change, effective_date]
    properties:
      target:
        description: "Use a typed identifier for the communication record affected by the change."
        examples:
          - "CNT014"
        oneOf:
          - $ref: "metamodel.schema.yaml#/$defs/message_ref"
          - $ref: "metamodel.schema.yaml#/$defs/campaign_ref"
          - $ref: "metamodel.schema.yaml#/$defs/content_ref"
      change:
        description: "Choose the event that best describes the change in communication execution."
        examples:
          - "retire"
        type: string
        enum: [launch, pause, resume, retire, rewrite, resegment, retarget, repurpose]
      effective_date:
        description: "Record when the change becomes effective in the communication timeline."
        examples:
          - "2026-05-01"
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      reason:
        description: "Explain the audience, timing, or execution consideration behind this change."
        type: string
