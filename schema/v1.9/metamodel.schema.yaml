---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Metamodel
description: >
  Cross-cutting definitions for brandvoice schemas. Provides typed IDs,
  versioning, shared refs, optional links to blueprint entities, and common
  traceability patterns for strategy, activation, and governance planes.

$defs:
  semver:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version string (MAJOR.MINOR.PATCH)."

  schema_version:
    type: string
    enum: ["1.1.0", "1.3.0", "1.4.0", "1.5.0", "1.6.0", "1.6.1", "1.6.2", "1.7.0", "1.8.0", "1.9.0", "1.9.1", "1.9.2", "1.9.3"]
    description: >
      Brandvoice schema version constant for the v1 suite. v1.3.0 includes viewer-oriented empathy,
      SWOT, and VPC enrichments (formerly described under v1.2.0), plus brand_scripts (BSC) for
      multiple StoryBrand / narrative backbones per brand and optional brand_script_ref on messages.
      v1.4.0 adds an optional `geo_scope` object (see `$defs/geo_scope`) on market-level entities
      - evidence, markets, competitors, forces, opportunities, risks - so multi-region portfolios
      can tag provenance and applicability without losing backward compatibility.
      v1.5.0 adds capacity planning entities: `priority_stream (PRI###)` for revenue stream
      prioritization and `roadmap_phase (RMP###)` for quarterly roadmap phases, both modeled
      in `strategy/capacity-priorities.yaml`.
      v1.6.0 adds `ecosystem_player (EPL###)` in `market/ecosystem.yaml` - a first-class entity
      for referral partners, co-presenters, distribution channels, complementary experts, and
      coopetition peers. Distinct from competitor (CPR): competitors frame competitive threat
      and need-fit, ecosystem players frame cooperation intent, relationship status, and
      collaboration ideas. Entries that are both (e.g., a direct competitor who could also
      co-present) link to the CPR side via `also_competitor_ref`.
      v1.6.2 accepts `BSC` ids in `any_entity_ref`, widens the evidence `type` and
      `source_type` vocabularies and adds the `x-gdsm.modeling_guidance` ledger.
      v1.7.0 adds three optional fields: `superseded_by` on an evidence record (the
      evidence records that replace its claims), and `status` (active, beta, deprioritized,
      sunset) and `superseded_by` (the offerings that replace it) on an offering.
      v1.8.0: a brand-core file requires only `version`, so a file holding only tone, verbal,
      asset or profile entries validates on its own.
      v1.9.0 adds five optional fields: `target_audiences` and `competitors` on an offering,
      `evidence_level` and `description` on an audience, and `evidence_level` on a persona.
      v1.9.1 recommends five story framework names for `narrative_backbone.framework`; the
      field stays a free string.

  tags:
    type: array
    items:
      type: string
    description: "Free-form tags for filtering and grouping."

  context_prefix:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Scope prefix in kebab-case for multi-brand or multi-market modeling."

  # --- ID refs (3-letter prefixes) ---
  brand_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?BRD\\d{3}$"
    description: "Brand identity reference. Identify the brand that owns the strategy or assets being modeled."

  brand_script_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?BSC\\d{3}$"
    description: >
      Brand narrative script reference (StoryBrand / SB7-style backbone or other framework rows
      scoped to one brand). Rationale: one BRD can own multiple scripts for different audiences.

  audience_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?AUD\\d{3}$"
    description: "Audience segment reference. Identify the audience segment chosen for a communication decision."

  persona_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PER\\d{3}$"
    description: "Persona reference. Identify the research-based profile used to represent a recurring audience pattern."

  job_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?JOB\\d{3}$"
    description: "Jobs-to-be-done reference. Identify the progress someone seeks in a particular situation."

  value_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?VAL\\d{3}$"
    description: "Value proposition reference. Identify the promise of value that addresses the linked audience needs."

  position_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?POS\\d{3}$"
    description: "Positioning reference. Identify the strategic positioning used to frame the brand against alternatives."

  message_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MSG\\d{3}$"
    description: "Message reference. Identify the individual message selected to convey a claim."

  proof_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRF\\d{3}$"
    description: "Proof point reference. Identify the proof point readers can consult to substantiate a claim."

  tone_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?TON\\d{3}$"
    description: "Tone guideline reference. Identify the guidance used to adapt expression to the audience or situation."

  verbal_guideline_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?VRB\\d{3}$"
    description: "Verbal guideline reference. Identify the reusable writing rule relevant to this expression."

  asset_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?AST\\d{3}$"
    description: "Distinctive brand asset reference. Identify the distinctive element used to make the brand recognizable."

  archetype_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ARC\\d{3}$"
    description: "Brand archetype reference. Identify the archetype guiding recognizable brand behavior and expression."

  model_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?BMD\\d{3}$"
    description: "Business model strategy element reference. Identify the business model element that explains how value is created or captured."

  channel_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CHN\\d{3}$"
    description: "Channel reference. Identify the touchpoint through which an audience encounters the brand."

  campaign_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CMP\\d{3}$"
    description: "Campaign reference. Identify the campaign coordinating activity around a defined objective."

  content_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CNT\\d{3}$"
    description: "Content asset reference. Identify the deliverable that carries a message in a specified format."

  actor_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ACT\\d{3}$"
    description: "Actor reference. Identify the role whose behavior or needs matter to the record."

  need_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?NED\\d{3}$"
    description: "Need reference. Identify the problem or desired outcome that motivates the actor."

  offering_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?OFF\\d{3}$"
    description: "Offering reference. Identify the product or service intended to meet a need."

  journey_stage_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?JSG\\d{3}$"
    description: "Journey stage reference. Identify the step in the audience experience where the activity belongs."

  action_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ACN\\d{3}$"
    description: "Action reference. Identify the behavior an audience member is invited or expected to take."

  outcome_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?OUT\\d{3}$"
    description: "Outcome reference. Identify the intended result associated with an action or activity."

  competitor_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CPR\\d{3}$"
    description: "Competitor reference. Identify the alternative buyers might choose in the decision being modeled."

  context_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CTX\\d{3}$"
    description: "Context reference. Identify the situation that shapes an actor's needs or choices."

  decision_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?DEC\\d{3}$"
    description: "Governance decision reference. Identify the decision record containing the rationale for a choice."

  evidence_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?EVD\\d{3}$"
    description: "Evidence record reference. Identify the observation or source record that supports or challenges a claim."

  test_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?TST\\d{3}$"
    description: "Experiment or test reference. Identify the experiment used to check an assumption about the strategy."

  metric_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MET\\d{3}$"
    description: "Metric reference. Identify the measure used to track a specific observable quantity."

  kpi_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?KPI\\d{3}$"
    description: "KPI reference. Identify the indicator used to judge progress toward a stated objective."

  risk_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?RSK\\d{3}$"
    description: "Risk reference. Identify the uncertain event or condition that could affect the strategy."

  migration_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MIG\\d{3}$"
    description: "Migration reference. Identify the change record that explains how the model evolved."

  personal_brand_profile_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PBP\\d{3}$"
    description: "Personal brand profile reference. Identify the profile that guides how an individual presents their brand."

  message_house_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MHS\\d{3}$"
    description: "Message house reference. Identify the framework that organizes a central message and its supporting pillars."

  message_pillar_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MPL\\d{3}$"
    description: "Message pillar reference. Identify a supporting argument within its parent message house."

  program_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRG\\d{3}$"
    description: "Activation program reference. Identify the sustained initiative that coordinates related campaigns and content."

  content_pillar_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CPL\\d{3}$"
    description: "Content pillar reference. Identify the recurring editorial theme to which a content asset contributes."

  market_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MKT\\d{3}$"
    description: "Market reference. Identify the defined market whose buyers and boundaries frame the analysis."

  market_force_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MFR\\d{3}$"
    description: "Market force reference. Identify the external change shaping demand, competition, or market conditions."

  opportunity_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?OPP\\d{3}$"
    description: "Opportunity reference. Identify the candidate opening whose demand and strategic fit are being assessed."

  position_map_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PMP\\d{3}$"
    description: "Position map reference. Identify the comparison map that defines the axes used to place alternatives."

  white_space_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?WSP\\d{3}$"
    description: "Position-map white space reference. Identify the region within a position map where demand may be underserved."

  priority_stream_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRI\\d{3}$"
    description: "Priority revenue stream reference (added v1.5.0)."

  roadmap_phase_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?RMP\\d{3}$"
    description: "Roadmap phase reference (added v1.5.0)."

  ecosystem_player_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?EPL\\d{3}$"
    description: >
      Ecosystem player reference (added v1.6.0). Points to a referral partner,
      co-presenter, distribution channel, complementary expert, or coopetition
      peer defined in `market/ecosystem.yaml`. See `$defs/ecosystem_player_ref`
      in `market/ecosystem.schema.yaml` for the full entity shape.

  file_ref_placeholder:
    type: object
    additionalProperties: false
    required: [$ref]
    properties:
      $ref:
        examples:
          - "market/landscape.yaml"
        type: string
        description: "Relative path to the plane content file (e.g., 'market/landscape.yaml')."
    description: >
      Composition placeholder used in root brandvoice.yaml plane slots to include
      a separate YAML file's content at that position. The referenced file is
      loaded and validated separately against its own plane schema by the
      per-file validator. Root-level schema only verifies that the wiring is a
      well-formed single-key `$ref` object.

  any_entity_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(BRD|BSC|AUD|PER|JOB|VAL|POS|MSG|PRF|TON|VRB|AST|ARC|BMD|CHN|CMP|CNT|ACT|NED|OFF|JSG|ACN|OUT|CPR|CTX|DEC|TST|MET|KPI|RSK|MIG|PBP|MHS|MPL|PRG|CPL|EVD|MKT|OPP|MFR|PMP|WSP|PRI|RMP|EPL)\\d{3}$"
    description: >
      Reference to any entity in the brandvoice schema. Union of all typed
      ID prefixes. MAINTENANCE: update this pattern when adding new entity types.

  # --- Optional interoperability with blueprint schema ---
  blueprint_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(CN|CMD|EVT|QRY|DOC|ACT|G|R|D|CAP|TC|EC|ER|SCR|UAC|UNV|TM|DPT|PRT)\\d{3}$"
    description: "Optional reference to blueprint entity identifiers."

  optional_blueprint_links:
    type: object
    additionalProperties: false
    description: "Optional links to blueprint entities for integration."
    properties:
      entities:
        description: "List the Blueprint identifiers tied to this Brandvoice element."
        examples:
          - ["tool-library.CAP004"]
        type: array
        items:
          $ref: "#/$defs/blueprint_ref"
      rationale:
        type: string
        description: "Why this brandvoice element links to blueprint entities."

  evidence_refs:
    type: array
    items:
      $ref: "#/$defs/evidence_ref"
    description: "References to supporting evidence records."

  empathy_map_item:
    type: object
    additionalProperties: false
    required: [statement]
    description: >
      Single observation within an empathy-map quadrant. The statement captures
      a concrete thought, feeling, signal, pain, or gain associated with the
      persona. Intensity is optional and supports viewer prioritization.
    properties:
      statement:
        examples:
          - "I worry that the tool will be unavailable when I need it."
        type: string
        description: "Empathy observation or quote. Capture one concrete observation in the relevant quadrant."
      intensity:
        examples:
          - "high"
        type: string
        enum: [low, medium, high, critical]
        description: "Optional signal strength for visualization or prioritization."
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        examples:
          - ["EVD014"]
        $ref: "#/$defs/evidence_refs"

  empathy_map:
    type: object
    additionalProperties: false
    description: >
      Structured empathy map for a persona. All quadrants are optional.
      Semantics are intentionally distinct from persona.goals and
      persona.barriers: gains capture value received from a solution, while
      pains capture current frustrations in the persona's world.
    properties:
      thinks:
        description: "Record the questions or assumptions that occupy the persona during the experience."
        examples:
          - [{"statement":"Will the drill be available on Saturday morning?"}]
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      feels:
        description: "Capture emotions the persona experiences in the relevant situation."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      sees:
        description: "Record the options, signals, or surroundings the persona notices."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      hears:
        description: "Capture what other people or channels tell the persona."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      says_and_does:
        description: "Record what the persona expresses or does in observable behavior."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      pains:
        description: "Capture current frustrations that make the experience harder for the persona."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"
      gains:
        description: "Capture the value the persona receives when the solution works for them."
        type: array
        items:
          $ref: "#/$defs/empathy_map_item"

  swot_item:
    type: object
    additionalProperties: false
    required: [statement]
    description: "Single SWOT statement for strengths or weaknesses."
    properties:
      statement:
        description: "Describe one internal condition that affects the brand strategy."
        type: string
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "#/$defs/evidence_refs"

  swot_opportunity_item:
    type: object
    additionalProperties: false
    required: [statement]
    description: "SWOT opportunity statement with optional canonical opportunity linkage."
    properties:
      statement:
        description: "Describe an external development that the brand could act on."
        type: string
      opportunity_ref:
        description: "Link the detailed opportunity record if the model already tracks it."
        $ref: "#/$defs/opportunity_ref"
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "#/$defs/evidence_refs"

  swot_threat_item:
    type: object
    additionalProperties: false
    required: [statement]
    description: "SWOT threat statement with optional canonical risk linkage."
    properties:
      statement:
        description: "Describe an external development that could harm the brand strategy."
        type: string
      risk_ref:
        description: "Link the risk record that tracks the exposure described here."
        $ref: "#/$defs/risk_ref"
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "#/$defs/evidence_refs"

  swot:
    type: object
    additionalProperties: false
    description: >
      SWOT snapshot for a brand. Strengths and weaknesses describe internal
      factors; opportunities and threats describe external factors.
    properties:
      strengths:
        description: "Record capabilities or resources the brand can draw on."
        type: array
        items:
          $ref: "#/$defs/swot_item"
      weaknesses:
        description: "Record internal limitations that make strategic work harder."
        type: array
        items:
          $ref: "#/$defs/swot_item"
      opportunities:
        description: "Record favorable external conditions that could support a strategic move."
        type: array
        items:
          $ref: "#/$defs/swot_opportunity_item"
      threats:
        description: "Record external conditions that could undermine the current strategy."
        type: array
        items:
          $ref: "#/$defs/swot_threat_item"

  vpc_pain_reliever:
    type: object
    additionalProperties: false
    required: [need_ref, mechanism]
    description: >
      Structured pain reliever linking a value proposition to a specific need
      with an explanation of how the pain is reduced.
    properties:
      need_ref:
        description: "Identify the need behind the frustration this mechanism reduces."
        $ref: "#/$defs/need_ref"
      mechanism:
        description: "Explain which step becomes easier and how the offering makes that happen."
        examples:
          - "Showing availability before checkout avoids trips for tools already on loan."
        type: string
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "#/$defs/evidence_refs"

  vpc_gain_creator:
    type: object
    additionalProperties: false
    required: [need_ref, mechanism]
    description: >
      Structured gain creator linking a value proposition to a specific need
      with an explanation of how the gain is created.
    properties:
      need_ref:
        description: "Identify the need addressed by the added value this mechanism creates."
        $ref: "#/$defs/need_ref"
      mechanism:
        description: "Explain what useful result the offering makes possible for the actor."
        examples:
          - "A saved project list lets borrowers plan supplies for their next visit."
        type: string
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "#/$defs/evidence_refs"

  impact_links:
    type: object
    additionalProperties: false
    description: "Cross-entity impact references for traceability."
    properties:
      actors:
        description: "List the roles whose behavior or responsibilities may change."
        type: array
        items:
          $ref: "#/$defs/actor_ref"
      needs:
        description: "List the needs whose importance or fulfillment may change."
        type: array
        items:
          $ref: "#/$defs/need_ref"
      offerings:
        description: "List the products or services whose fit or delivery may change."
        type: array
        items:
          $ref: "#/$defs/offering_ref"
      channels:
        description: "List the touchpoints where the audience experience may change."
        type: array
        items:
          $ref: "#/$defs/channel_ref"
      journey_stages:
        description: "List the points in the audience journey affected by the change."
        type: array
        items:
          $ref: "#/$defs/journey_stage_ref"
      actions:
        description: "List the audience behaviors encouraged or affected by the change."
        type: array
        items:
          $ref: "#/$defs/action_ref"
      outcomes:
        description: "List the expected results that may need to be reassessed."
        type: array
        items:
          $ref: "#/$defs/outcome_ref"
      competitors:
        description: "List the alternatives whose relevance to buyer decisions may change."
        type: array
        items:
          $ref: "#/$defs/competitor_ref"
      contexts:
        description: "List the situations that should be revisited when assessing the change."
        type: array
        items:
          $ref: "#/$defs/context_ref"
      markets:
        description: "List the markets where assumptions or responses may need revision."
        type: array
        items:
          $ref: "#/$defs/market_ref"
      audiences:
        description: "List the audience segments affected by the change in strategy."
        type: array
        items:
          $ref: "#/$defs/audience_ref"
      values:
        description: "List the value propositions whose relevance or credibility may change."
        type: array
        items:
          $ref: "#/$defs/value_ref"
      positioning:
        description: "List the strategic positions that may need re-evaluation."
        type: array
        items:
          $ref: "#/$defs/position_ref"
      messages:
        description: "List the individual messages that may need to be revised."
        type: array
        items:
          $ref: "#/$defs/message_ref"
      campaigns:
        description: "List the campaigns that may need an execution adjustment."
        type: array
        items:
          $ref: "#/$defs/campaign_ref"
      kpis:
        description: "List the indicators whose interpretation or targets may need review."
        type: array
        items:
          $ref: "#/$defs/kpi_ref"
      evidence:
        description: "List the evidence records relevant to reviewing the claimed impact."
        type: array
        items:
          $ref: "#/$defs/evidence_ref"
      verbal_guidelines:
        description: "List the writing conventions that may need an update."
        type: array
        items:
          $ref: "#/$defs/verbal_guideline_ref"
      ecosystem_players:
        description: "List the partners or peers whose relationship may be affected."
        type: array
        items:
          $ref: "#/$defs/ecosystem_player_ref"

  # --- Shared vocab ---
  priority:
    type: string
    enum: [critical, high, medium, low]
    description: "Relative importance for planning and execution."

  lifecycle_status:
    type: string
    enum: [draft, active, paused, deprecated, archived]
    description: "Lifecycle status of an entity. Indicate whether the record is in preparation, use, suspension, or retirement."

  evidence_level:
    type: string
    enum: [hypothesis, weak-signal, moderate-evidence, strong-evidence]
    description: "Confidence level backed by evidence quality."

  market_sizing_tier:
    type: string
    enum: [tam, sam, som]
    description: >
      Market sizing tier. TAM = Total Addressable Market (entire demand universe),
      SAM = Serviceable Addressable Market (reachable with current model),
      SOM = Serviceable Obtainable Market (realistic near-term capture).

  demand_intensity:
    type: string
    enum: [latent, emerging, moderate, strong, urgent]
    description: >
      Strength of buyer demand signal. latent = need exists but buyers don't
      actively seek solutions, urgent = buyers actively spending to solve now.

  fulfillment_level:
    type: string
    enum: [unmet, poorly-met, adequately-met, well-met, over-served]
    description: >
      How well a need is currently being served in the market. Based on
      Christensen's jobs-to-be-done satisfaction spectrum.

  buyer_readiness:
    type: string
    enum: [unaware, problem-aware, solution-aware, product-aware, ready-to-buy]
    description: >
      Eugene Schwartz awareness stages. Indicates how ready buyers in a
      segment or white space are to purchase.

  universal_phase:
    type: string
    enum: [unaware, aware, engaged, committed, active, loyal, advocate]
    description: >
      Normalized journey phase. Maps across frameworks:
      unaware (pre-funnel), aware (AARRR:acquisition, AIDA:attention, RACE:reach, STDC:see),
      engaged (AARRR:activation, AIDA:interest, RACE:act, STDC:think),
      committed (AIDA:desire, RACE:convert, STDC:do),
      active (AARRR:retention, RACE:convert),
      loyal (AARRR:revenue, RACE:engage, STDC:care),
      advocate (AARRR:referral, RACE:engage, STDC:care).

  geo_scope:
    type: object
    additionalProperties: false
    required: [level]
    description: >
      Geographic applicability of a market-level record (evidence, market,
      competitor, force, opportunity, risk). `level` is the coarse scope
      the viewer uses for filtering and badges. When `level = country`,
      the `countries` array names one or more ISO 3166-1 alpha-2 codes -
      this is how PL-only, DE-only, and multi-country national scopes are
      expressed. `region_label` carries informal human labels ("DACH",
      "Nordics", "Pomorze", "Benelux"). Omit the whole block when the
      record has no meaningful geographic constraint - such records are
      treated as "untagged" by the viewer (never silently assumed to be
      any particular region). Added in schema v1.4.0.
    properties:
      level:
        examples:
          - "country"
        type: string
        enum: [local, country, europe, global]
        description: >
          local   - city / voivodeship / metro (pair with `region_label`).
          country - one or more specific countries (REQUIRES `countries`).
          europe  - EU / EEA / UK / wider Europe.
          global  - worldwide.
      countries:
        examples:
          - ["DE","NL"]
        type: array
        items:
          type: string
          pattern: "^[A-Z]{2}$"
        minItems: 1
        uniqueItems: true
        description: >
          ISO 3166-1 alpha-2 country codes (e.g. PL, DE, FR, NL, GB, US).
          Required when `level = country`; optional otherwise (e.g. to
          narrow a `europe`-level record to the 2-3 countries it really
          covers).
      region_label:
        examples:
          - "Northern Europe"
        type: string
        description: >
          Informal human label for the scope: "DACH", "Nordics",
          "Pomorze", "Benelux", etc. Pairs well with `local` and
          `europe` to give a human-readable chip in the viewer.
      notes:
        examples:
          - "The survey covered members in the two countries listed."
        type: string
        description: "Rationale or caveats for the geographic tag."
    allOf:
      - if:
          properties:
            level:
              const: country
          required: [level]
        then:
          required: [countries]

# ── GDSM self-description + modeling-guidance ledger ─────────────────────────
# modeling_guidance is the schema-native home for durable modeling wisdom for
# this suite, surfaced on-demand by the brandvoice MCP's get_analysis_guidance
# tool (Archally Pro).
x-gdsm:
  version: "1.0.0"
  methodology: "GDSM v1.0 (Goal-Driven Schema Modeling)"
  status: draft
  suite_name: "brandvoice"
  purpose: >
    Cross-cutting brandvoice metamodel - typed IDs, versioning, shared refs.
    Also carries the suite-level modeling_guidance ledger.
  design_notes: >
    modeling_guidance entries are durable, reusable lessons for anyone
    authoring a brandvoice model; served on-demand by get_analysis_guidance,
    never auto-loaded.
  modeling_guidance:
    - lesson: >
        A `plane` is a perspective (market / strategy / activation /
        governance), not a file; a `layer` is the schema file type that
        carries it (e.g. `*.market.yaml`). Choosing a plane is a modeling
        decision - choosing a file/layer is an organization decision.
      category: semantics
      date: "2026-06-28"
      evidence: >
        Authoring session 2026-06-28 - plane-vs-layer mental-model
        correction.
      schema_version: "1.6.1"
    - lesson: >
        `white_space` is not a top-level entity - it nests under
        `position_maps[].white_spaces`; likewise `message_pillar` nests under
        `message_houses[].pillars`. Add them inside their parent, not as
        standalone records.
      category: structure
      date: "2026-06-28"
      evidence: >
        Same session - structural gotcha found while adding positioning
        entities.
      schema_version: "1.6.1"
    - lesson: >
        `competitor`, `action`, `outcome`, and `risk` can appear in more than
        one plane. Pick a canonical plane deliberately and keep each instance
        there; do not duplicate the same entity across planes.
      category: structure
      date: "2026-06-28"
      evidence: "Same session - multi-plane placement ambiguity."
      schema_version: "1.6.1"
    - lesson: >
        On upsert, competitors and market-forces dedup by `name`
        (case-insensitive) - never create a second record for the same named
        competitor or force.
      category: gotcha
      date: "2026-06-28"
      evidence: "Session - encoded as a deterministic CLI verb."
      schema_version: "1.6.1"
      enforced_by: "bv merge-market"
    - lesson: >
        An evidence record with an excerpt and a `source_url` quotes the page the URL names.
        Before writing one, fetch the URL and confirm the excerpt is on it; where the phrase
        lives on a different page by the same authors, cite that page. A record whose URL does
        not carry its excerpt is unverifiable, and it looks exactly like one that does.
      category: workflow
      date: "2026-09-05"
      evidence: >
        A record citing a method's home page for a phrase the page does not carry validated
        cleanly and resolved cleanly; the phrase was on the authors' own article elsewhere.
        Nothing in the model can tell the two apart, so the check has to happen before the
        record is written.
      schema_version: "1.6.2"
    - lesson: >
        A positioning that names a family of capabilities says in its own text which members
        exist and which are planned, and carries no `reasons_to_believe` for a member that has no
        proof asset. A brandvoice model is read on its own, so a `planned` marker held in some
        other model beside it does not reach the reader of the positioning.
      category: workflow
      date: "2026-09-05"
      evidence: >
        A positioning named a family of four sources while the fourth was still planned in a
        separate model. The positioning was accurate only because two things were done by hand:
        the empty `reasons_to_believe` and the marker on the other side. Neither is a rule, so
        neither survives the next edit.
      schema_version: "1.6.2"
