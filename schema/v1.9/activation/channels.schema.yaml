---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Activation - Channels
description: >
  Channel portfolio and channel policies for message distribution, media mix,
  and tone adaptation.
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    description: "Track changes to the content of this model file using semantic versioning."
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    description: "Declare which Brandvoice schema release this file targets."
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    description: "Set the local namespace used to distinguish identifiers across model scopes."
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    description: "Add reusable labels that help readers find related records."
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  channels:
    description: "List the touchpoints available to deliver messages and invite audience action."
    examples:
      - [{"id":"CHN002","name":"Member newsletter","media_type":"owned"}]
    type: array
    items:
      $ref: "#/$defs/channel"

$defs:
  channel:
    description: "Describe a repeatable touchpoint and the audience purpose it serves."
    type: object
    additionalProperties: false
    required: [id, name, media_type]
    properties:
      id:
        description: "Keep this identifier stable when distribution or ownership details change."
        examples:
          - "CHN002"
        $ref: "../metamodel.schema.yaml#/$defs/channel_ref"
      name:
        description: "Use the label the team recognizes when planning distribution."
        examples:
          - "Member newsletter"
        type: string
      media_type:
        description: "Choose the category that reflects how the team gains access to the audience."
        examples:
          - "owned"
        type: string
        enum: [owned, paid, earned, shared]
      audience_refs:
        description: "Link the segments the team expects to reach through this touchpoint."
        examples:
          - ["AUD002"]
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/audience_ref"
      actor_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "Primitive-aligned targeting. Prefer this over audience_refs."
      context_refs:
        description: "Link the situations in which this channel is relevant or usable."
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/context_ref"
      journey_stage_refs:
        description: "Link the specific journey stages at which this touchpoint is useful."
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/journey_stage_ref"
      message_refs:
        description: "Link messages intended for delivery through this touchpoint."
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/message_ref"
      tone_adaptation:
        type: string
        description: "How core voice is adapted for this channel."
      objective:
        description: "Choose the main audience result the channel is intended to support."
        examples:
          - "engagement"
        type: string
        enum: [awareness, engagement, consideration, conversion, retention, advocacy]
      universal_phases:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/universal_phase"
        description: >
          Normalized journey phases this channel primarily serves.
          Prefer this over the legacy objective enum for cross-schema queries.
      constraints:
        description: "Describe practical limits that shape content, publishing, or audience reach."
        examples:
          - ["Send at most one newsletter per month."]
        type: array
        items:
          type: string
      status:
        description: "Indicate whether this channel is being prepared, used, paused, or retired."
        $ref: "../metamodel.schema.yaml#/$defs/lifecycle_status"
      evidence_refs:
        description: "Link the evidence records a reviewer can consult to check these claims."
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      tags:
        description: "Add reusable labels that help readers find related records."
        $ref: "../metamodel.schema.yaml#/$defs/tags"
