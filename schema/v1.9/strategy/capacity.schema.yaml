---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Strategy - Capacity & Roadmap
description: >
  Schema for capacity planning and quarterly roadmap modeling.
  Introduced in schema v1.5.0 to support solo and small-team brandvoice models
  where revenue stream prioritization and phased delivery are first-class concerns.

  File convention: strategy/capacity-priorities.yaml

  Entities:
    PRI### - priority_stream  (revenue / service stream with priority, rationale, and refs)
    RMP### - roadmap_phase    (quarterly or milestone phase with goals, budget, KPI)

  Non-entity block:
    capacity_model - scalar config object (total_working_days_per_year, allocations).
                     Not extracted as a graph entity; used for dashboard / viewer context.

$defs:

  priority_stream:
    type: object
    required: [id, name, priority]
    additionalProperties: false
    description: >
      A prioritized revenue or service stream. Captures strategic rationale,
      time investment, revenue estimate, and links to offerings and opportunities.
    properties:
      id:
        type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?PRI\\d{3,}$"
        description: "Typed entity ID, e.g. PRI001."
      name:
        examples:
          - "Facilitated repair workshops"
        type: string
        description: "Human-readable stream name."
      priority:
        examples:
          - 1
        type: integer
        minimum: 1
        description: "Rank within the plan (1 = highest priority)."
      rationale:
        type: string
        description: "Why this stream is prioritized at this rank."
      time_investment:
        examples:
          - "12 working days per quarter"
        type: string
        description: "Estimated time cost (free text, e.g. '10 dni')."
      revenue_estimate:
        examples:
          - "EUR 8,000 to 12,000 per year"
        type: string
        description: "Expected annual revenue range (free text)."
      strategic_value:
        examples:
          - "Builds a repeatable route to training new repair coordinators."
        type: string
        description: "Qualitative strategic importance label."
      timing:
        type: string
        description: "Expected launch or milestone timing (free text)."
      dependencies:
        examples:
          - - Confirm access to a room with four workstations.
        type: array
        items:
          type: string
        description: "Prerequisite conditions or tasks before launch."
      offering_ref:
        description: Link the offering that this stream is expected to deliver.
        $ref: "../metamodel.schema.yaml#/$defs/offering_ref"
      opportunity_ref:
        description: Link the opportunity that makes this investment worth prioritizing.
        $ref: "../metamodel.schema.yaml#/$defs/opportunity_ref"
      evidence_refs:
        description: >-
          Link source records that support the claims or choices captured here.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      tags:
        description: >-
          Add short labels that help contributors group and find related records.
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  roadmap_phase:
    type: object
    required: [id, name]
    additionalProperties: false
    description: >
      A quarterly or milestone-bounded delivery phase. Groups goals, budget
      allocation, and success KPIs into a single traceable entity.
    properties:
      id:
        type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?RMP\\d{3,}$"
        description: "Typed entity ID, e.g. RMP001."
      name:
        type: string
        description: "Short phase label, e.g. 'Q2 2026: FUNDAMENT'."
      period:
        examples:
          - "April to June 2026"
        type: string
        description: "Human-readable calendar span, e.g. 'kwiecień-czerwiec 2026'."
      goals:
        examples:
          - - Run two pilot repair workshops and document the repeatable session format.
        type: array
        items:
          type: string
        description: "Concrete deliverables targeted in this phase."
      budget:
        examples:
          - "EUR 1,200 for venue and supplies"
        type: string
        description: "Estimated spend for the phase (free text)."
      kpi:
        examples:
          - "At least 12 attendees complete a guided repair by the end of June."
        type: string
        description: "Primary success metric(s) for the phase."
      evidence_refs:
        description: >-
          Link source records that support the claims or choices captured here.
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      tags:
        description: >-
          Add short labels that help contributors group and find related records.
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  capacity_model:
    type: object
    additionalProperties: true
    description: >
      Non-entity configuration block describing working-day allocation for a
      solo or small-team model. All properties are free-form integers or strings.
      Not extracted as a graph entity - used for dashboard and viewer context only.
    properties:
      total_working_days_per_year:
        description: >-
          Enter the annual pool of working days before deducting reserved time.
        examples:
          - 220
        type: integer
      reserved_for_administration:
        description: >-
          Estimate annual days for work such as scheduling, finance, and reporting.
        examples:
          - 24
        type: integer
      reserved_for_marketing_content:
        description: >-
          Estimate annual days needed for outreach and producing marketing materials.
        examples:
          - 30
        type: integer
      reserved_for_preparation:
        description: >-
          Estimate annual days spent preparing materials and settings for delivery.
        examples:
          - 36
        type: integer
      note:
        description: >-
          Explain the assumptions or seasonal constraints behind the allocation.
        examples:
          - "The workshop closes for the final two weeks of December."
        type: string

type: object
additionalProperties: false
# Root schema for a strategy/capacity-priorities.yaml file.
# Combine priority_streams, roadmap, and optional operational_risks and capacity_model
# in a single file under the strategy/ subdirectory.
# (Description kept as a comment rather than a `description:` key because the root of
# this file already has a top-level `description:` at line 4 - two sibling `description`
# keys at root level would be a duplicate-key YAML error.)
properties:
  version:
    description: Record the version declared for this capacity planning file.
    type: string
  schemaVersion:
    description: Identify the Brandvoice schema revision used to author this file.
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  capacity_model:
    description: >-
      Summarize annual working days and reservations before assigning time to delivery
      streams.
    $ref: "#/$defs/capacity_model"
  priority_streams:
    type: array
    items:
      $ref: "#/$defs/priority_stream"
    description: "Prioritized revenue or service streams (PRI### entities)."
  roadmap:
    type: array
    items:
      $ref: "#/$defs/roadmap_phase"
    description: "Sequential delivery phases (RMP### entities)."
  operational_risks:
    type: array
    description: >
      Operational risks specific to this capacity plan. Items follow the same
      shape as governance/decisions.yaml risks (RSK### IDs). Extracted by the
      core as 'risk' entities, same as governance-plane risks.
    items:
      type: object
      required: [id, name]
      additionalProperties: true
      properties:
        id:
          description: >-
            Assign a stable identifier so capacity reviews can cite the same risk.
          type: string
          pattern: "^([a-z][a-z0-9-]*\\.)?RSK\\d{3,}$"
        name:
          description: Name the event that could reduce available delivery capacity.
          type: string
        probability:
          description: Estimate how likely the event is within this capacity plan.
          examples:
            - "medium"
          type: string
          enum: [low, medium, high]
        impact:
          description: Rate the effect on delivery if this capacity risk occurs.
          type: string
          enum: [low, medium, high, critical]
        mitigation:
          description: >-
            Describe the action that lowers the probability or protects the delivery
            schedule.
          examples:
            - "Cross-train one coordinator before the summer schedule begins."
          type: string
        evidence_refs:
          description: >-
            Link source records that support the claims or choices captured here.
          $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
