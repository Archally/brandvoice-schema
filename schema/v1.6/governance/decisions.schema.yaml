---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Governance - Decisions
description: >
  Decision log for strategic and communication choices. Stores rationale,
  alternatives, impacts, and links to measured outcomes.
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  risks:
    type: array
    items:
      $ref: "#/$defs/risk"
  decisions:
    type: array
    items:
      $ref: "#/$defs/decision"

$defs:
  risk:
    type: object
    additionalProperties: false
    required: [id, title, likelihood, impact]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
      title:
        type: string
      likelihood:
        type: string
        enum: [low, medium, high]
      impact:
        type: string
        enum: [low, medium, high, critical]
      mitigation:
        type: string
      status:
        type: string
        enum: [identified, mitigating, accepted, resolved]
      affects:
        $ref: "../metamodel.schema.yaml#/$defs/impact_links"
      evidence_refs:
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      geo_scope:
        $ref: "../metamodel.schema.yaml#/$defs/geo_scope"
        description: >
          Optional geographic applicability of this risk. Use when the
          risk applies only to a specific region (e.g. a naming collision
          that only exists in one language market). See metamodel.geo_scope.
          Added in v1.4.0.
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  decision:
    type: object
    additionalProperties: false
    required: [id, title, status, date, rationale]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      title:
        type: string
      status:
        type: string
        enum: [proposed, accepted, rejected, superseded, landed]
      date:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      rationale:
        type: object
        additionalProperties: false
        required: [problem, selected]
        properties:
          problem:
            type: string
          alternatives:
            type: array
            items:
              type: string
          selected:
            type: string
          why:
            type: string
      impacts:
        $ref: "../metamodel.schema.yaml#/$defs/impact_links"
      risks:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
      evidence_refs:
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
      supersedes:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      blueprint_links:
        $ref: "../metamodel.schema.yaml#/$defs/optional_blueprint_links"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
