---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Governance - Experiments
description: >
  Experimentation and learning layer for message, channel, and campaign
  validation (for example A/B tests, copy tests, and concept validation).
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  experiments:
    type: array
    items:
      $ref: "#/$defs/experiment"

$defs:
  experiment:
    type: object
    additionalProperties: false
    required: [id, hypothesis, status]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/test_ref"
      hypothesis:
        type: string
      method:
        type: string
        enum: [ab-test, multivariate, interview, survey, concept-test, incrementality, other]
      status:
        type: string
        enum: [planned, running, completed, cancelled]
      variants:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
            message:
              $ref: "../metamodel.schema.yaml#/$defs/message_ref"
            channel:
              $ref: "../metamodel.schema.yaml#/$defs/channel_ref"
            content:
              $ref: "../metamodel.schema.yaml#/$defs/content_ref"
            action:
              $ref: "../metamodel.schema.yaml#/$defs/action_ref"
      success_metrics:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/metric_ref"
      expected_outcomes:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/outcome_ref"
      context_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/context_ref"
      evidence_refs:
        $ref: "../metamodel.schema.yaml#/$defs/evidence_refs"
        description: "Input evidence that informed the experiment design."
      result_summary:
        type: string
      result:
        type: object
        additionalProperties: false
        description: "Structured experiment result for programmatic analysis."
        properties:
          winner:
            type: string
            description: "Name of the winning variant (must match a variants[].name)."
          effect_size:
            type: string
            description: "Observed effect (e.g., '+12% CTR', '-3pp bounce rate')."
          confidence:
            type: number
            minimum: 0
            maximum: 1
            description: "Statistical confidence (0-1, e.g., 0.95 for 95%)."
          sample_size:
            type: integer
            description: "Total sample across all variants."
          conclusion:
            type: string
            enum: [winner-found, no-significant-difference, inconclusive, stopped-early]
      decision_outcome:
        $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      produced_evidence:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/evidence_ref"
        description: "Evidence records generated by this experiment's results."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
