---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brandvoice Governance - Evidence
description: >
  Traceable evidence records backing strategy and execution claims across
  entities, decisions, and experiments.
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  evidence:
    type: array
    items:
      $ref: "#/$defs/evidence_record"

$defs:
  evidence_record:
    type: object
    additionalProperties: false
    required: [id, title, type, date]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/evidence_ref"
      title:
        type: string
      type:
        type: string
        enum:
          - assumption
          - interview
          - survey
          - analytics
          - experiment
          - observation
          - secondary-research
          - expert-opinion
          - benchmark
          - internal-analysis
          - market-data
          - market-signal
          - competitor-intelligence
          - primary-data
        description: >
          Evidence source class. Rationale: distinguish externally observed
          signals from internally synthesized analysis for confidence weighting.
          Extended in v1.6.1: market-data, market-signal, competitor-intelligence,
          primary-data added for multi-brand portfolio evidence migration.
      date:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      source:
        type: string
        description: "Human-readable source label for the evidence artifact or origin."
      source_type:
        type: string
        enum:
          - first-party
          - third-party
          - internal
          - external
          - mixed
          - industry-report
          - thought-leadership
          - technology-report
          - analyst-report
          - market-data
          - competitor-website
          - own-website
          - self-assessment
          - third-party-validation
        description: >
          Origin or format of the evidence source. Party-based values (first-party,
          third-party, internal, external, mixed) classify who produced it.
          Format-based values (industry-report, competitor-website, etc.) classify
          what kind of publication it is. Extended in v1.6.1 with format-based values.
      source_url:
        type: string
        pattern: "^[a-z]+://.+$"
        description: "Canonical URL for the source when one exists."
      publisher:
        type: string
        description: "Organization, platform, or person that published the source."
      method:
        type: string
      sample_size:
        type: integer
      summary:
        type: string
      confidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence_level"
      supports:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/any_entity_ref"
        description: "Entity references this evidence supports."
      contradicts:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/any_entity_ref"
        description: "Entity references this evidence challenges."
      related_experiments:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/test_ref"
      related_decisions:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/decision_ref"
      geo_scope:
        $ref: "../metamodel.schema.yaml#/$defs/geo_scope"
        description: >
          Optional geographic applicability of this evidence record. See
          metamodel.geo_scope. Added in v1.4.0 — when omitted, viewers
          treat the record as geographically untagged.
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
